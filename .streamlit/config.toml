[server]
# 0.0.0.0: LAN ve HTTPS tünel (localtunnel/ngrok) için; 127.0.0.1 dışarıdan bağlanmayı keser.
address = "0.0.0.0"
port = 8501
headless = true
# Tünelde public Origin/Host localhost ile eşleşmez; Streamlit CORS/XSRF websocket'i keser.
# Küçük takım aracı (auth yok) — URL'yi yalnızca takım arkadaşıyla paylaşın.
enableCORS = false
enableXsrfProtection = false

[theme]
base = "dark"
primaryColor = "#B8952E"
backgroundColor = "#0C1014"
secondaryBackgroundColor = "#141A21"
textColor = "#E8EEF4"
font = "sans serif"

[browser]
gatherUsageStats = false
